<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modern Villainess Timeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a framed timeline "window" under a slim toolbar; the axis rides the top of the frame, event cards pack in lanes below it, a detail panel slides in from the right, and a minimap sits underneath. */
:root {
  --bg: #f1f0f8;
  --stage: #fbfaff;
  --surface: #ffffff;
  --surface-2: #f5f4fb;
  --ink: #1f1d3a;
  --ink-2: #55537a;
  --ink-3: #8886a8;
  --line: #e4e2f0;
  --line-strong: #cdcae2;
  --accent: #bf3f79;
  --accent-soft: #fbe5ee;
  --moon: #b98a2e;
  --hatch: rgba(86, 83, 122, 0.07);
  --shadow: 0 1px 2px rgba(31, 29, 58, 0.06), 0 6px 18px rgba(31, 29, 58, 0.07);
  --shadow-lift: 0 2px 4px rgba(31, 29, 58, 0.08), 0 14px 34px rgba(31, 29, 58, 0.16);
  --cat-finance: #2a78d6;
  --cat-politics: #eb6834;
  --cat-deals: #1baf7a;
  --cat-world: #eda100;
  --cat-personal: #e87ba4;
  --cat-shadow: #4a3aa7;
  --art-light: #ffffff;
  --art-deep: #15123a;
  --real: #0c7a3d;
  --altered: #a55a00;
  --fiction: #5a4bb5;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-cjk: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
  --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111024; --stage: #17162e; --surface: #211f40; --surface-2: #1b1a36;
    --ink: #efeef9; --ink-2: #b6b4d4; --ink-3: #807ea6;
    --line: #2c2b4f; --line-strong: #403e6c;
    --accent: #f191b8; --accent-soft: #3a2343; --moon: #e8c56c;
    --hatch: rgba(182, 180, 212, 0.07);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.28);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.35), 0 16px 38px rgba(0, 0, 0, 0.5);
    --cat-finance: #3987e5; --cat-politics: #d95926; --cat-deals: #199e70;
    --cat-world: #c98500; --cat-personal: #d55181; --cat-shadow: #9085e9;
    --art-light: #ffffff; --art-deep: #0d0b26;
    --real: #4cc98a; --altered: #f0a94a; --fiction: #a79cf2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111024; --stage: #17162e; --surface: #211f40; --surface-2: #1b1a36;
  --ink: #efeef9; --ink-2: #b6b4d4; --ink-3: #807ea6;
  --line: #2c2b4f; --line-strong: #403e6c;
  --accent: #f191b8; --accent-soft: #3a2343; --moon: #e8c56c;
  --hatch: rgba(182, 180, 212, 0.07);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.28);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.35), 0 16px 38px rgba(0, 0, 0, 0.5);
  --cat-finance: #3987e5; --cat-politics: #d95926; --cat-deals: #199e70;
  --cat-world: #c98500; --cat-personal: #d55181; --cat-shadow: #9085e9;
  --art-light: #ffffff; --art-deep: #0d0b26;
  --real: #4cc98a; --altered: #f0a94a; --fiction: #a79cf2;
  color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.cat-finance { --c: var(--cat-finance); }
.cat-politics { --c: var(--cat-politics); }
.cat-deals { --c: var(--cat-deals); }
.cat-world { --c: var(--cat-world); }
.cat-personal { --c: var(--cat-personal); }
.cat-shadow { --c: var(--cat-shadow); }

/* ── App frame ── */
.app {
  height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
  gap: 10px; padding-inline: 16px; padding-block: 12px 12px; min-width: 0;
}
.bar { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.moon {
  width: 30px; height: 30px; border-radius: 50%; flex: none; position: relative;
  background: radial-gradient(circle at 34% 34%, color-mix(in oklab, var(--moon) 55%, var(--surface)), var(--moon));
  box-shadow: 0 0 0 4px color-mix(in oklab, var(--moon) 16%, transparent);
}
.moon::after {
  content: ""; position: absolute; inset: -3px -9px 5px 9px; border-radius: 50%; background: var(--bg);
}
.brand h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px;
  letter-spacing: -0.01em; line-height: 1.1; text-wrap: balance;
}
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; cursor: pointer;
  font-size: 12.5px; font-weight: 600; color: var(--ink-2); transition: background 0.2s, color 0.2s, box-shadow 0.2s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.iconbtn {
  width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface);
  display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-2); font-size: 17px; line-height: 1;
  transition: border-color 0.2s, color 0.2s, transform 0.15s;
}
.iconbtn:hover { border-color: var(--line-strong); color: var(--ink); }
.iconbtn:active { transform: scale(0.94); }
.zoom { display: flex; align-items: center; gap: 6px; }
.search {
  height: 32px; width: 190px; max-width: 100%; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); padding: 0 11px; font: inherit; font-size: 13px;
}
.search::placeholder { color: var(--ink-3); }

.rail { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; min-width: 0; }
.scroller { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding-block: 2px; }
.scroller::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px 0 8px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  font-size: 12.5px; font-weight: 600; color: var(--ink); white-space: nowrap;
  transition: opacity 0.2s, border-color 0.2s, background 0.2s;
}
.chip:hover { border-color: var(--line-strong); }
.chip .n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); font-weight: 500; }
.chip[aria-pressed="false"] { opacity: 0.45; background: transparent; }
.chip.jump { padding: 0 11px; color: var(--ink-2); }
.chip.jump:hover { color: var(--ink); }
.rail .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; flex: none; }
.rail .count { margin-left: auto; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; flex: none; }
.sep { width: 1px; height: 18px; background: var(--line-strong); flex: none; }

.glyph {
  flex: none; width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center;
  font-family: var(--font-cjk); font-size: 11px; font-weight: 700; line-height: 1; color: var(--ink);
  background: color-mix(in oklab, var(--c) 24%, var(--surface));
  box-shadow: inset 0 0 0 1.5px var(--c);
}

/* ── Main: stage + panel ── */
.main { display: flex; min-height: 0; min-width: 0; }
.stage {
  position: relative; flex: 1 1 0; min-width: 0; border-radius: 16px; overflow: hidden;
  background: var(--stage); border: 1px solid var(--line); touch-action: none; cursor: grab;
  user-select: none; -webkit-user-select: none;
}
.stage.dragging { cursor: grabbing; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.world { position: absolute; left: 0; top: 0; will-change: transform; }
.fade {
  position: absolute; left: 0; right: 0; bottom: 0; height: 46px; pointer-events: none;
  background: linear-gradient(to top, var(--stage), transparent); opacity: 0; transition: opacity 0.3s;
}
.more {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); pointer-events: none;
  font-size: 11.5px; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 10px; opacity: 0; transition: opacity 0.3s; box-shadow: var(--shadow);
}
.stage.overflow .fade, .stage.overflow .more { opacity: 1; }
.hint {
  position: absolute; right: 12px; bottom: 12px; font-size: 11.5px; color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; pointer-events: none;
  transition: opacity 0.6s; box-shadow: var(--shadow);
}
.hint.gone { opacity: 0; }
.empty {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: var(--ink-2);
  font-size: 14px; text-align: center; padding: 24px;
}

/* ── Event cards ── */
.ev { position: absolute; left: 0; top: 0; will-change: transform; }
.ev.off { display: none; }
.ev-y { position: absolute; left: 0; top: 0; transition: transform 0.34s var(--ease), opacity 0.25s; }
.ev.gone .ev-y { opacity: 0; pointer-events: none; }
.span {
  position: absolute; left: 0; top: 0; height: var(--h); border-radius: 10px; pointer-events: none;
  background: color-mix(in oklab, var(--c) 10%, transparent);
  border: 1px dashed color-mix(in oklab, var(--c) 55%, transparent);
  transition: height 0.3s var(--ease);
}
.card {
  --w: 172px; --h: 28px;
  position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); padding: 0; margin: 0; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; cursor: pointer;
  box-shadow: 0 1px 2px rgba(20, 18, 50, 0.05);
  transition: width 0.32s var(--ease), height 0.32s var(--ease), box-shadow 0.2s, border-color 0.2s, translate 0.2s var(--ease);
  display: flex; flex-direction: column;
}
.card:hover, .card.is-hot { border-color: color-mix(in oklab, var(--c) 70%, var(--line)); box-shadow: var(--shadow-lift); translate: 0 -2px; z-index: 3; }
.card.is-sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow-lift); z-index: 2; }
.ev:has(.card:hover), .ev:has(.card.is-hot) { z-index: 5; }
.ev:has(.card.is-sel) { z-index: 4; }
.tier-m { --w: 228px; --h: 64px; border-radius: 11px; }
.tier-l { --w: 258px; --h: 230px; border-radius: 13px; }
.card .thumb { flex: none; height: 0; transition: height 0.32s var(--ease); position: relative; overflow: hidden; }
.tier-l .thumb { height: 100px; }
.card .body { display: flex; gap: 7px; padding: 4px 8px 4px 5px; min-width: 0; align-items: flex-start; }
.tier-m .body { padding: 8px 10px 8px 9px; gap: 9px; }
.tier-l .body { padding: 10px 12px 12px 11px; gap: 9px; }
.card .txt { min-width: 0; flex: 1; }
.card .title {
  font-weight: 600; font-size: 12.5px; line-height: 18px; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tier-m .title, .tier-l .title {
  white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  font-size: 13px; line-height: 17px; text-wrap: balance;
}
.tier-l .title { font-family: var(--font-display); font-size: 14.5px; line-height: 18px; letter-spacing: -0.005em; }
.card .meta {
  display: none; margin-top: 3px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tier-m .meta, .tier-l .meta { display: block; }
.card .brief {
  display: none; margin: 6px 0 0; font-size: 12px; line-height: 16px; color: var(--ink-2);
  -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
}
.tier-l .brief { display: -webkit-box; }
.fig {
  position: absolute; right: 8px; bottom: 8px; font-family: var(--font-mono); font-weight: 600; font-size: 11.5px;
  color: var(--art-light); background: color-mix(in oklab, var(--art-deep) 72%, transparent);
  padding: 2px 8px; border-radius: 999px; backdrop-filter: blur(4px);
}

.stage.compact .card { --w: 156px; }
.stage.compact .card.tier-m { --w: 200px; }
.stage.compact .card.tier-l { --w: 232px; }

/* ── Illustrations ── */
.art {
  --art-d: color-mix(in oklab, var(--c) 42%, var(--art-deep));
  position: absolute; inset: 0;
  background: linear-gradient(140deg, color-mix(in oklab, var(--c) 72%, var(--art-light)) 0%, var(--c) 48%, color-mix(in oklab, var(--c) 70%, var(--art-deep)) 100%);
}
.art svg { width: 100%; height: 100%; display: block; }
.art .a { fill: var(--art-light); opacity: 0.95; }
.art .b { fill: var(--art-light); opacity: 0.6; }
.art .c { fill: var(--art-light); opacity: 0.24; }
.art .d { fill: var(--art-d); }
.art .g { fill: var(--art-d); opacity: 0.34; }
.art .s { fill: none; stroke: var(--art-light); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.95; }
.art .sd { fill: none; stroke: var(--art-d); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.art .t { fill: none; stroke: var(--art-light); stroke-width: 2.5; stroke-linecap: round; opacity: 0.6; }

/* ── Hover preview ── */
.pop {
  position: fixed; z-index: 40; width: 280px; background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-lift); pointer-events: none;
  opacity: 0; transform: translateY(6px) scale(0.98); transform-origin: top left;
  transition: opacity 0.16s, transform 0.2s var(--ease);
}
.pop.on { opacity: 1; transform: none; }
.pop .ph { position: relative; height: 128px; }
.pop .pb { padding: 11px 13px 13px; }
.pop h3 { margin: 0; font-family: var(--font-display); font-size: 15px; line-height: 19px; text-wrap: balance; }
.pop .when { margin-top: 4px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.pop p { margin: 8px 0 0; font-size: 12.5px; line-height: 17px; color: var(--ink-2); }
.pop .cta { margin-top: 9px; font-size: 11px; color: var(--ink-3); }

/* ── Detail panel ── */
.panel {
  flex: none; width: 0; opacity: 0; overflow: hidden; margin-left: 0;
  transition: width 0.4s var(--ease), opacity 0.3s, margin-left 0.4s var(--ease);
}
.panel.open { width: min(430px, 44vw); opacity: 1; margin-left: 12px; }
.panel-in {
  width: min(430px, 44vw); height: 100%; background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
}
.phead { display: flex; align-items: center; gap: 6px; padding: 9px 10px 9px 14px; border-bottom: 1px solid var(--line); flex: none; }
.phead .pos { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); margin-right: auto; font-variant-numeric: tabular-nums; }
.pscroll { overflow-y: auto; min-height: 0; flex: 1; overscroll-behavior: contain; }
.hero { position: relative; height: 168px; }
.pbody { padding: 16px 18px 26px; display: flex; flex-direction: column; gap: 16px; }
.pbody h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 27px; letter-spacing: -0.015em; text-wrap: balance; }
.dateline { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); }
.dateline small { display: block; font-family: var(--font-body); font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 7px;
  background: var(--surface-2); border: 1px solid var(--line); font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
}
.tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tag.h-real { color: var(--real); border-color: color-mix(in oklab, var(--real) 40%, var(--line)); }
.tag.h-altered { color: var(--altered); border-color: color-mix(in oklab, var(--altered) 40%, var(--line)); }
.tag.h-fiction { color: var(--fiction); border-color: color-mix(in oklab, var(--fiction) 40%, var(--line)); }
.lede { margin: 0; font-size: 14.5px; line-height: 22px; color: var(--ink); max-width: 62ch; }
.count-down {
  display: flex; align-items: baseline; gap: 8px; padding: 10px 12px; border-radius: 11px;
  background: var(--accent-soft); color: var(--ink);
}
.count-down b { font-family: var(--font-mono); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.count-down span { font-size: 12px; color: var(--ink-2); }
.sec h4 {
  margin: 0 0 7px; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); font-weight: 700;
}
.sec ul { margin: 0; padding: 0 0 0 17px; display: flex; flex-direction: column; gap: 6px; }
.sec li { font-size: 13.5px; line-height: 20px; color: var(--ink); max-width: 62ch; }
.sec li::marker { color: var(--c, var(--ink-3)); }
.sec p { margin: 0; font-size: 13.5px; line-height: 20px; max-width: 62ch; }
.reading { display: flex; flex-direction: column; gap: 9px; }
.reading div { font-size: 13.5px; line-height: 20px; max-width: 62ch; }
.conf {
  display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 5px; margin-right: 7px; vertical-align: 1px; border: 1px solid var(--line-strong); color: var(--ink-2);
}
.conf.s { color: var(--real); border-color: color-mix(in oklab, var(--real) 45%, var(--line)); }
.conf.p { color: var(--altered); border-color: color-mix(in oklab, var(--altered) 45%, var(--line)); }
.conf.x { color: var(--fiction); border-color: color-mix(in oklab, var(--fiction) 45%, var(--line)); }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.person {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; font-size: 12px;
  cursor: pointer; color: var(--ink); transition: border-color 0.2s;
}
.person:hover { border-color: var(--line-strong); }
.links { display: flex; flex-direction: column; gap: 6px; }
.link {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color 0.2s, background 0.2s;
}
.link:hover { border-color: var(--line-strong); background: var(--surface-2); }
.link .lt { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link .ld { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); flex: none; }

/* ── Minimap ── */
.mini { position: relative; height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--stage); overflow: hidden; cursor: pointer; touch-action: none; }
.mini canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

@media (max-width: 820px) {
  .app { gap: 8px; padding-block: 10px 10px; }
  .brand p { display: none; }
  .brand h1 { font-size: 17px; }
  .search { width: 130px; }
  .rail .count, .rail .label { display: none; }
  .rail { gap: 6px; }
  .rail .scroller { flex: 1 1 100%; }
  .rail .sep { display: none; }
  .zoom .iconbtn { display: none; }
  .seg button { padding: 5px 8px; font-size: 12px; }
  .panel { position: fixed; inset: 0; z-index: 30; width: auto; margin: 0; opacity: 0; pointer-events: none; transform: translateX(100%); transition: transform 0.36s var(--ease), opacity 0.2s; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); background: color-mix(in oklab, var(--bg) 70%, transparent); }
  .panel.open { width: auto; margin: 0; opacity: 1; pointer-events: auto; transform: none; }
  .panel-in { width: 100%; }
  .mini { height: 48px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .ev-y, .card, .card .thumb, .panel, .pop, .span { transition: none !important; }
}

<script>
// Modern Villainess event dataset — part 1: backstory and Volume 1.
// Schema: id, t (title), d (ISO date), e (optional end date), when (display date),
// basis: "text" (date given in the novel) | "real" (placed on the date of its real-world counterpart) | "est" (estimated from the chapter's time span)
// vol, ch, cat (finance|politics|deals|world|personal|shadow), motif (illustration), fig (key figure),
// hist: "real" | "altered" | "fiction" | "story", brief, what[], reveal[], real (real-world note), sig[[label, text]], who[], links[]
window.MV_EVENTS = (window.MV_EVENTS || []).concat([

/* ───────────── Backstory (not to scale) ───────────── */
{ id:"normandy", pre:1, t:"Normandy fails; Japan negotiates its surrender", when:"1944–45", basis:"text",
  vol:1, ch:"Ch. 2", cat:"world", motif:"war", hist:"altered",
  brief:"The Allies lose the Normandy landings and Germany fights on. Japan’s surrender is negotiated, so the peerage and the zaibatsu survive.",
  what:["The Allies lose at Normandy; Germany keeps fighting.","Japan surrenders on negotiated terms, then declares war on the Axis (Vol. 3 adds this), preserving many national interests.","The peerage is never abolished, the zaibatsu are never dissolved, and the Privy Council survives with its power suspended.","Nobles keep ‘impunity to arrest’ and a form of diplomatic immunity, which the glossary credits to Runa’s grandfather."],
  real:"Altered. In reality the Allies won at Normandy, Japan’s surrender was unconditional, and the peerage and zaibatsu were dissolved. The glossary states the divergence outright.",
  sig:[["s","This is the root divergence. Everything else follows from it: wealthier zaibatsu, a titled nobility, and a three-quarters-Russian protagonist produced by Cold War espionage."]],
  who:["Keikain Hikomaro"], links:["karafutocrisis","second226"] },

{ id:"daqing", pre:2, t:"Oil is struck in Manchuria, a decade early", when:"c. late 1940s", basis:"est",
  vol:1, ch:"Ch. 7", cat:"world", motif:"oil", hist:"altered",
  brief:"An American-backed Japanese speculator hits the Daqing field. Young Toudou throws him a box of Lucky Strikes moments before the well blows.",
  what:["Toudou, cut out of his zaibatsu’s inner clique, is sent to Heilongjiang because nobody with standing would go.","His mentor, known only as ‘the speculator’, stakes everything on a Manchurian field with American equipment. Iwazaki settles for a 30/70 joint venture.","The well blows. Covered in crude, the speculator laughs: ‘I did it! I really did it!’","Kuomintang forces, backed by the US and Japan, hold Manchuria and the Communists are driven out.","The speculator dies with nothing and leaves his daughter an empty Lucky Strikes box. Toudou later marries her."],
  reveal:["The alternate history extends beyond Japan: the Chinese Civil War diverged in Manchuria."],
  real:"Altered. Daqing was really discovered on 26 September 1959 by Chinese geologists, and the Communists took Manchuria in the 1948 Liaoshen Campaign. The novel reverses both.",
  sig:[["s","The empty box is the chapter’s thesis: fortune does not survive, but the memory of one self-made moment does."],["p","The speculator is a cautionary mirror for Runa. He had the genius and none of the protective structure she has in Tachibana and Ichijou."]],
  who:["Toudou Nagayoshi"], links:["akamatsu"] },

{ id:"karafutocrisis", pre:3, t:"The Karafuto Crisis: Northern Japan is founded", when:"c. early 1950s, during the Manchurian War", basis:"est",
  vol:3, ch:"Ch. 3", cat:"world", motif:"map", hist:"fiction",
  brief:"The USSR invades Japanese southern Karafuto and sets up the People’s Democratic Republic of Northern Japan. The partition is of Karafuto, not the home islands.",
  what:["Karafuto (Sakhalin) had been split after the Russo-Japanese War.","When Japan enters the Manchurian War, the USSR invades the Japanese south and installs a Soviet-aligned state with a Stasi-style Ministry of National Security.","The West wins the Manchurian War. The US defends Manchuria but acknowledges Northern Japan, to avoid nuclear war and to penalize Japan for its WWII surrender."],
  reveal:["This corrects an impression easily taken from Vol. 1: the home islands were never divided."],
  real:"Fictional, modeled on the German and Korean partitions. The ‘Manchurian War’ is the narration’s Korean War analogue.",
  sig:[["s","The account is given in Maefuji’s chapter. The man who arrests Runa in the game is the one who explains why her world exists."]],
  who:["Maefuji Shouichi"], links:["normandy","reunification","sniper"] },

{ id:"second226", pre:4, t:"The second February 26 Incident", when:"c. 1967", basis:"text",
  vol:2, ch:"Ch. 8", cat:"politics", motif:"diet", hist:"fiction",
  brief:"Literary figures call for a ‘Shōwa Restoration’. A battalion occupies central Tokyo and kills members of the nobility and the zaibatsu.",
  what:["An author’s call to overthrow the nobility and zaibatsu triggers a military uprising.","A battalion occupies central Tokyo and murders people linked to those classes.","The Imperial Police are disbanded afterward.","A memorial is held thirty-four years later, in 2001."],
  real:"Fictional. The real February 26 Incident was the 1936 coup attempt and had no sequel. The glossary says the idea is borrowed from Mamoru Oshii’s Kerberos Saga.",
  sig:[["p","It explains the nobility’s siege mentality, the ‘impunity to arrest’ privilege, and why nobles now lobby for arms and hire private military companies."]],
  who:[], links:["normandy","tower"] },

{ id:"cocom", pre:5, t:"The Far Eastern CoCom scandal and Otsumaro’s death", when:"c. late 1980s", basis:"est",
  vol:1, ch:"Ch. 2", cat:"shadow", motif:"document", hist:"altered",
  brief:"Runa’s father is caught diverting machine tools to Northern Japan. Protected from arrest by his blood, he dies by apparent suicide.",
  what:["Keikain Otsumaro built the Far Eastern Group with Russian émigré backing. It was a front for Eastern technology theft.","Machine tools are diverted to Northern Japan during the Sakata combine construction, a CoCom violation.","Otsumaro dies by apparent suicide. Secretary-General Katou used his own impunity to bury the collusion (Vol. 1 Ch. 4).","Tachibana tells Runa this history himself."],
  reveal:["Vol. 2 Ch. 7: it was Tachibana who pushed Otsumaro to suicide. Runa does not know."],
  real:"Altered. The glossary names the real 1987 Toshiba Machine/Kongsberg affair, in which milling machines sold to the USSR made submarine propellers quieter.",
  sig:[["x","Tachibana’s guilt gives him a permanent motive to manage what Runa learns, which makes him an unreliable source for everything told about her father."]],
  who:["Keikain Otsumaro","Tachibana Ryuuji","Katou Kazuhiro"], links:["tachibanahome","birth"] },

{ id:"reunification", pre:6, t:"The Winter Festival Revolution reunifies Karafuto", when:"c. 1990, after the Berlin Wall falls", basis:"est",
  vol:1, ch:"Ch. 8", cat:"world", motif:"news", hist:"fiction",
  brief:"Northern Japan’s secret police launch a coup during Maslenitsa with the army’s endorsement. Japan occupies Karafuto.",
  what:["The secret police use Maslenitsa festival security to launch a coup. Abroad it is called the Maslenitsa Revolution.","The secret-police chief defects and enables a largely peaceful reunification. His daughter is Shisuka Lydia.","Hokkaido ends up about 80% Japanese, 10% Russian and 10% Chinese. Former Northern citizens are treated as second-class."],
  real:"Fictional. Its shape follows German reunification after 1989, and the glossary invites comparison with a Korean division that actually ended.",
  who:["Shisuka Lydia"], links:["karafutocrisis","essays","karafutobank"] },

{ id:"birth", pre:7, t:"Keikain Runa is born", when:"c. 1990", basis:"est",
  vol:1, ch:"Ch. 2", cat:"personal", motif:"grave", hist:"story",
  brief:"A dead office worker wakes as the villainess of an otome game. Her mother, a Romanov honeytrap, dies soon after the birth.",
  what:["A modern office worker dies after their employer collapses and is reborn as Keikain Runa, villainess of ‘Love Where the Cherry Blossom Falls’.","Her mother, Natasha Alexandrovna Romanova, was a great-granddaughter of Tsar Alexander III, deployed by Northern Japan as a honeytrap.","As a toddler Runa confirms her identity with three tests and rules out being literally inside the game.","At the Sakata graves she lays white lilies and cries, wondering whether the tears are hers or ‘the real Keikain Runa’s’."],
  reveal:["Tachibana noticed her at two or three because the books she read were always reshelved correctly (Vol. 2 Ch. 7)."],
  real:"Story event. Tsar Alexander III is real; the Romanov descent is invented.",
  sig:[["s","She keeps full memory of the game and of real-world history. That foreknowledge is the premise of everything that follows."]],
  who:["Keikain Runa","Natasha Romanova","Tachibana Ryuuji"], links:["cocom","crash2008","ledgers"] },

/* ───────────── Volume 1 ───────────── */
{ id:"karafutobank", d:"1994-06-15", when:"1994", basis:"text",
  t:"Karafuto Bank is nationalized",
  vol:1, ch:"Ch. 6", cat:"world", motif:"news", hist:"fiction",
  brief:"In-world press: post-reunification Karafuto struggles with corruption and brain drain, and its former central bank is nationalized over bad debts.",
  what:["Karafuto Nippo and other papers report corruption, brain drain and bureaucratic dysfunction.","MITI intervenes. Iwazaki, Yodoyabashi and Futaki compete over the island’s resources.","Karafuto Bank, the former Northern Japanese central bank, is nationalized over bad debts."],
  real:"Fictional. Reported as newspaper extracts, with no narration.",
  sig:[["s","Documents inside the story carry the partition backstory without slowing the plot."]],
  who:[], links:["reunification","superj","combine"] },

{ id:"superj", d:"1995-06-15", when:"1995", basis:"text",
  t:"‘Super-J’ counterfeit yen appears",
  vol:1, ch:"Ch. 6", cat:"shadow", motif:"news", hist:"altered",
  brief:"A high-quality counterfeit yen note surfaces from the old Northern regime’s networks, against the backdrop of the Kobe earthquake and the Aum attacks.",
  what:["The Great Hanshin Earthquake and the Aum Shinrikyo incidents form the year’s backdrop.","‘Super-J’, a near-perfect counterfeit yen note, appears from the old regime’s residual networks."],
  real:"Altered. The glossary says Super-J is based on North Korea’s counterfeit dollar ‘supernotes’. The earthquake (17 Jan 1995) and the Aum attacks are real.",
  who:[], links:["karafutobank","kidnap"] },

{ id:"ledgers", d:"1995-04-20", when:"c. spring 1995", basis:"est",
  t:"A five-year-old asks for the secret ledgers", fig:"¥500m",
  vol:1, ch:"Ch. 2", cat:"finance", motif:"vault", hist:"story",
  brief:"Runa finds her household quietly shrinking, walks into Far Eastern Bank and demands the real books, ‘and the ones for your secret accounts too’.",
  what:["The household spends about ¥3m a month against income that has fallen from ¥5m to ¥3m. Aki needing a scholarship is the tell.","At the bank’s Tokyo branch Runa demands the true balance sheet and deflects refusal by announcing she is the family’s marriage asset.","She mortgages the estate for ¥500m against an appraisal near ¥1bn, deliberately leaving headroom.","Tachibana becomes guardian of record and branch manager Ichijou Susumu becomes her operator."],
  reveal:["Runa holds the economic exposure and the decisions. The adults hold the legal and reputational exposure."],
  real:"Story event, placed by the yen’s real 1995 high near ¥80 to the dollar, which is her entry point.",
  sig:[["s","Proxy control starts here as a clever workaround for a minor. Vol. 4’s Koizumi names it as the defect that makes her power illegitimate."]],
  who:["Keikain Runa","Ichijou Susumu","Tachibana Ryuuji"], links:["moonlight","qualified"] },

{ id:"moonlight", d:"1995-05-15", e:"1997-02-15", when:"c. 1995 – early 1997", basis:"est",
  t:"The Moonlight Fund turns ¥500m into ¥50bn", fig:"¥50bn",
  vol:1, ch:"Ch. 2", cat:"finance", motif:"chartup", hist:"story",
  brief:"An offshore fund stacks a US browser IPO, an IT basket and a yen trade bought near ¥80 to the dollar. She closes out when the yen passes ¥120.",
  what:["Three legs: a US browser-company IPO (about $100m), an IT basket (about $100m), and FX bought at ¥80/$ and unwound toward ¥100/$.","The equity gain and the currency gain compound on the same position.","Collateral is Far Eastern Life Insurance’s assets, borrowed against at a ‘Japan premium’.","When the yen passes ¥120 she cancels her positions to lock in profit.","The Ministry of Finance notices a lender behaving like a trading desk, and Runa has to lie low."],
  real:"The ¥80/$ high of 1995, the dot-com run-up and the Japan premium are real. The trade itself is fiction and assumes foreknowledge with no slippage.",
  sig:[["s","Borrowing at a penalty rate for a directional bet is rational only with extraordinary conviction. Foreknowledge supplies it."],["p","Using a life insurer’s assets to fund speculation is a textbook conflict inside a financial conglomerate."]],
  who:["Keikain Runa","Ichijou Susumu"], links:["ledgers","fareastern","browser"] },

{ id:"kindergarten", d:"1996-05-20", when:"c. 1996", basis:"est",
  t:"Kindergarten: Asuka, Hotaru and the Pine Corridor brawl",
  vol:1, ch:"Ch. 3", cat:"personal", motif:"school", hist:"story",
  brief:"Runa insists on kindergarten over the family’s wish to hide her. She meets Asuka and Hotaru, and fights the boys who mock Mio’s doll.",
  what:["The main family wants her isolated, ostensibly over her blonde hair and actually over her father’s scandal.","She meets Kasugano Asuka, a Dietman’s daughter from Ehime who insists mandarins are ‘oranges’.","She meets Kaihouin Hotaru, who cannot be found at hide-and-seek, even on video.","Boys mock Amane Mio for needing her doll and a brawl follows: the ‘Incident of the Pine Corridor’."],
  real:"Story event. The glossary confirms the 1991 beef and orange import liberalization that the Kasugano family opposed.",
  who:["Kasugano Asuka","Kaihouin Hotaru","Amane Mio"], links:["dollhouse","essays"] },

{ id:"fareastern", d:"1996-10-15", when:"c. late 1996", basis:"est",
  t:"The Far Eastern Group is restructured", fig:"¥30bn",
  vol:1, ch:"Ch. 2", cat:"deals", motif:"merge", hist:"story",
  brief:"Runa carves out the hotels, lets the property arm fail on purpose and buys a third of the bank: a pre-packaged bankruptcy.",
  what:["The Moonlight Fund buys Far Eastern Hotels for ¥30bn before the property arm files.","Far Eastern Developments repays down to ¥15bn and files for corporate rehabilitation at the Yamagata District Court.","The bank writes off the rest from trading profits.","The remaining ¥20bn buys a 33% stake in Far Eastern Bank."],
  real:"Fictional group, real technique: extract value, isolate the loss in a shell, plug the hole with outside capital, acquire the reorganized whole.",
  sig:[["p","Far Eastern Developments is a jusen in miniature. Runa’s first rescue is a scale model of the problem that broke Japan."],["p","A generous related-party transfer just before filing is what a real trustee would attack."]],
  who:["Keikain Runa","Ichijou Susumu"], links:["moonlight","sankai"] },

{ id:"schoolday", d:"1997-04-08", when:"c. April 1997", basis:"est",
  t:"First day of school: a message to her future self",
  vol:1, ch:"Ch. 3", cat:"personal", motif:"school", hist:"story",
  brief:"On home video, child-Runa records a message asking her future self whether she is happy. The battery dies.",
  what:["Home video of her first day at Imperial Gakushuukan Academy.","She records a message to her future self asking if she is happy.","The battery dies mid-recording."],
  sig:[["s","Chapter 1 has already answered the question. The warmth she builds is what makes 2008 land as loss."]],
  who:["Keikain Runa"], links:["crash2008","quartet"] },

{ id:"debut", d:"1997-05-24", when:"c. spring 1997", basis:"est",
  t:"The debut party: Runa names her father’s scandal",
  vol:1, ch:"Ch. 3", cat:"personal", motif:"crown", hist:"story",
  brief:"At her Keikain debut she mentions the scandal in front of the Duke, on purpose. Katou meets her with visible emotion, and she meets Teia Eiichi.",
  what:["She references her father’s scandal before Duke Kiyomaro, turning apparent naïveté into leverage.","Secretaries arrive from Finance Minister Izumikawa and Secretary-General Katou. Katou’s district is Sakata.","Nakamaro asks Teia Eiichi to befriend her. She teaches him vending machines and cola, echoing a game scene.","At the Keika Group’s fiftieth anniversary she overhears talk of ‘the girl who dreamt up Keika Bank’ and learns Iwazaki is circling."],
  reveal:["She begins to suspect her downfall is a political purge of Far Eastern associates, not a romantic betrayal."],
  real:"Story event. Katou Kazuhiro maps to Katō Kōichi; Iwazaki maps to Mitsubishi.",
  who:["Keikain Kiyomaro","Katou Kazuhiro","Teia Eiichi","Keikain Nakamaro"], links:["quartet","engagement","iwazakirefuse"] },

{ id:"sankai", d:"1997-06-15", when:"June 1997", basis:"text",
  t:"Sankai Securities bought under the ‘Keika Rules’", fig:"¥80bn",
  vol:1, ch:"Ch. 2", cat:"finance", motif:"bank", hist:"altered",
  brief:"The first rung of the ladder. Runa takes the smallest failing broker and, with it, a live Bank of Japan special loan.",
  what:["Sankai carries ¥80bn in bad debt. The ministry’s own securities division had already failed to fix it.","The Keika Rules: dismiss the executives, punish malpractice, send all bad loans to the RCC, reduce capital, issue new shares to a third party, take a BOJ special loan.","Buying Sankai acquires the thing that matters: an existing claim on the state’s safety net."],
  real:"Altered. Sankai is Sanyo Securities, which really failed on 3–4 November 1997, the first postwar failure of a securities firm. Here it is rescued months earlier.",
  sig:[["s","The rules are a good-bank/bad-bank resolution with a bail-in of equity, the architecture real resolution authorities use."],["s","Nobody walks into the ministry and asks for trillions. Each rung buys credibility for the next."]],
  who:["Keikain Runa","Ichijou Susumu"], links:["fareastern","ichiyama","memoir"] },

{ id:"quartet", d:"1997-07-20", when:"c. July 1997", basis:"est",
  t:"The Gakushuukan Quartet forms",
  vol:1, ch:"Ch. 3", cat:"personal", motif:"tea", hist:"story",
  brief:"Runa meets Yuujirou at an adult qualification exam and Mitsuya in a café over a shared book. With Eiichi, they become the Quartet.",
  what:["She meets Izumikawa Yuujirou at an exam hall where both elementary schoolers are sitting adult certifications.","Gotou Mitsuya is recruited at a café over a shared book.","With Teia Eiichi, the four become ‘the Gakushuukan Quartet’."],
  reveal:["She is knowingly assembling the people who will denounce her, and chooses warmth anyway."],
  real:"Story event. The chapter is dated by Princess Mononoke’s July 1997 release.",
  sig:[["s","Building affection for her eventual accusers makes Chapter 1 land as loss, not comeuppance."]],
  who:["Teia Eiichi","Izumikawa Yuujirou","Gotou Mitsuya"], links:["debut","avanti","crash2008"] },

{ id:"pudding", d:"1997-07-30", when:"c. summer 1997", basis:"est",
  t:"Naoyuki’s plea and the pudding lesson", fig:"¥9,900",
  vol:1, ch:"Ch. 2", cat:"finance", motif:"tea", hist:"story",
  brief:"Katsura Naoyuki begs her to save Hokkaido Kaitaku Bank. Ichijou explains bad debt with a ¥100 coin and Aki’s homemade pudding.",
  what:["Naoyuki works in the very department sinking Hokkaido Kaitaku and prostrates himself. Runa sends ¥100m at once.","Her anger at ‘an era that created a society that wouldn’t reward even the hardest of efforts’ turns her into an active interventionist.","Ichijou’s lesson: money has value because it is perceived to, on the guarantee of a third party.","Runa sells a pudding for ¥10,000 and buys it back at ¥100. The ¥9,900 gap is the non-performing loan."],
  real:"Story event. The lesson is a compressed statement of the credit theory of money.",
  sig:[["s","The pudding dramatizes a bubble instead of explaining one: book value and market value diverge."],["p","Naoyuki’s stake converts macro-finance into something personal."]],
  who:["Katsura Naoyuki","Ichijou Susumu","Tokitou Aki"], links:["kaitaku","sme"] },

{ id:"ichiyama", d:"1997-08-20", when:"c. August 1997", basis:"est",
  t:"Ichiyama merged into Sankai: the reverse merger", fig:"¥260bn",
  vol:1, ch:"Ch. 2", cat:"finance", motif:"merge", hist:"altered",
  brief:"The larger, scandal-ridden broker is folded into the smaller one so that Sankai’s special loan survives and Ichiyama’s hidden losses can be reset.",
  what:["Ichiyama hides ¥260bn in a tobashi scheme and has paid off corporate bouncers, so it cannot get a BOJ special loan directly.","It merges into the smaller Sankai. The survivor takes the assets at current market value.","Both safety nets are inherited and the residue goes to the Resolution and Collection Corporation.","Tachibana plays the ministry’s divisions against each other: no division wants the failure on its watch."],
  real:"Altered. Ichiyama is Yamaichi Securities, which announced its closure on 24 November 1997 after hiding about ¥260bn in tobashi losses. The payoffs match the 1997 Koike sōkaiya scandal.",
  sig:[["s","The reverse merger exists because of the sōkaiya scandal. The payoff and the tobashi are one culture of manipulated client accounts."],["s","Press attention fixes on the legible villain and never examines the structure beneath."]],
  who:["Keikain Runa","Tachibana Ryuuji"], links:["sankai","kaitaku","mofscandal"] },

{ id:"matsuno", d:"1997-09-25", when:"c. autumn 1997", basis:"est",
  t:"Toudou joins; Matsuno Trading is bailed out", fig:"¥180bn",
  vol:1, ch:"Ch. 4", cat:"deals", motif:"oil", hist:"story",
  brief:"A resources man with a Manchurian past becomes Runa’s advisor, and the Fund buys up a trading company’s loans from its banks.",
  what:["Toudou Nagayoshi joins and points to gas and oil tied to Karafuto and Sakata.","Runa moves assets into Swiss private banking.","Katou is revealed as complicit in the cover-up that destroyed her father. His backing for Sakata now reads as atonement.","The Moonlight Fund buys ¥180bn of Matsuno Trading’s loans and intervenes in its management."],
  reveal:["Meeting Runa, Toudou sees the speculator’s smile and reaches for a cigarette before stopping himself."],
  real:"Story event. Matsuno later merges with Akamaru, which echoes Marubeni.",
  who:["Toudou Nagayoshi","Katou Kazuhiro"], links:["daqing","akamatsu"] },

{ id:"kaitaku", d:"1997-10-28", when:"c. autumn 1997", basis:"est",
  t:"Takeover bid for Hokkaido Kaitaku Bank at ¥74", fig:"¥2.3tn",
  vol:1, ch:"Ch. 2", cat:"finance", motif:"bank", hist:"altered",
  brief:"Runa waits for the shares to hit ¥59, then bids ¥74 through a ‘California-based’ fund fronted by a real American lawyer.",
  what:["Hokkaido Kaitaku carries ¥2.3tn in bad debt.","She waits until failure is near-certain (¥59 a share) and bids ¥74.","The bid comes from the ‘California-based Moonlight Fund’, fronted at a press conference by a lawyer-actor whose credentials survive checking.","The spokesman ad-libs that the owner has Russian blood. Runa ‘didn’t know then the full impact’ of that line."],
  reveal:["Runa believes she has broken the chain reaction: ‘At least, that was what I believed at the time.’"],
  real:"Altered, and the novel’s first major divergence. Hokkaido Takushoku Bank really failed on 17 November 1997, the first postwar city-bank failure. Its shares fell to ¥65.",
  sig:[["s","The convoy system survives 1997 in this timeline because Runa becomes its last escort ship."],["s","Buying equity in a bank with ¥2.3tn of holes is an entry ticket to the negotiating table, not a rescue."]],
  who:["Keikain Runa","Katsura Naoyuki"], links:["ichiyama","keikabank","kidnap"] },

{ id:"browser", d:"1997-11-11", when:"11 November 1997", basis:"text",

{ id:"qualified", d:"2002-05-08", when:"c. spring 2002", basis:"est",
  t:"‘You simply aren’t qualified’",
  vol:4, ch:"Ch. 9", cat:"politics", motif:"diet", hist:"story",

  sig:[["s","The objection is not that she is a child or wrong. It is that she is unaccountable, and the text gives her no rebuttal."],["s","Vol. 5 reframes the defeat as a rescue."]],

    const b = ev.target.closest && ev.target.closest('.card'); if (!b) return;

    hotId = null; hidePop(); requestDraw();
  });
  world.addEventListener('click', (ev) => {
    const b = ev.target.closest && ev.target.closest('.card'); if (!b || moved) return;
    select(b.dataset.id, false);
  });
  world.addEventListener('focusin', (ev) => {
    const b = ev.target.closest && ev.target.closest('.card'); if (!b) return;
    const e = byId[b.dataset.id];
    if (b.matches(':focus-visible')) { stage.scrollLeft = 0; stage.scrollTop = 0; reveal(e, false); }
  });
  stage.addEventListener('scroll', () => { stage.scrollLeft = 0; stage.scrollTop = 0; });

  /* ── Detail panel ── */
  function daysToCrash(e) {
    if (e.pre) return null; const d = CRASH - e.day;
    return d > 0 ? d : null;
  }
  function renderPanel(e) {
    const list = EV.filter(vis), idx = list.indexOf(e);
    pos.textContent = idx >= 0 ? (idx + 1) + ' of ' + list.length : '';
    const h = HIST[e.hist] || HIST.story, cd = daysToCrash(e);
    let html = '<div class="cat-' + e.cat + '"><div class="hero">' + artHTML(e) + '</div><div class="pbody">';
    html += '<div class="tags"><span class="tag"><span class="glyph" aria-hidden="true">' + CAT[e.cat].glyph + '</span>' + esc(CAT[e.cat].name) + '</span><span class="tag">Vol. ' + e.vol + ' · ' + esc(e.ch) + '</span><span class="tag ' + h[1] + '">' + h[0] + '</span></div>';
    html += '<h2 id="ptitle" tabindex="-1">' + esc(e.t) + '</h2>';
    html += '<div class="dateline">' + esc(e.when) + '<small>' + BASIS[e.basis] + '</small></div>';
    html += '<p class="lede">' + esc(e.brief) + '</p>';
    if (cd) html += '<div class="count-down"><b>' + cd.toLocaleString('en-US') + '</b><span>days before the crash of 15 September 2008</span></div>';
    else if (e.id === 'crash2008') html += '<div class="count-down"><b>Day zero</b><span>the night every other event counts down to</span></div>';
    const sec = (title, inner) => '<div class="sec"><h4>' + title + '</h4>' + inner + '</div>';
    const ul = (arr) => '<ul>' + arr.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ul>';
    if (e.what && e.what.length) html += sec('What happens', ul(e.what));
    if (e.reveal && e.reveal.length) html += sec('Revelations', ul(e.reveal));
    if (e.real) html += sec('Real-world history', '<p>' + esc(e.real) + '</p>');
    if (e.sig && e.sig.length) html += sec('Reading', '<div class="reading">' + e.sig.map((s) => '<div><span class="conf ' + s[0] + '">' + CONF[s[0]] + '</span>' + esc(s[1]) + '</div>').join('') + '</div>');
    if (e.who && e.who.length) html += sec('People', '<div class="people">' + e.who.map((p) => '<button type="button" class="person" data-person="' + esc(p) + '">' + esc(p) + '</button>').join('') + '</div>');
    if (e.links.length) html += sec('Connected events', '<div class="links">' + e.links.map((id) => { const o = byId[id]; return '<button type="button" class="link cat-' + o.cat + '" data-go="' + o.id + '"><span class="glyph" aria-hidden="true">' + CAT[o.cat].glyph + '</span><span class="lt">' + esc(o.t) + '</span><span class="ld">' + esc(o.when.replace(/^c\. /, '')) + '</span></button>'; }).join('') + '</div>');
    html += '</div></div>';
    pscroll.innerHTML = html; pscroll.scrollTop = 0;
  }
  function select(id, center, focusPanel) {
    const e = byId[id]; if (!e) return;
    if (selId && byId[selId]) byId[selId].card.classList.remove('is-sel');
    selId = id; e.card.classList.add('is-sel'); hidePop();
    renderPanel(e);
    const wasOpen = panel.classList.contains('open');
    panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
    const go = () => reveal(e, center);
    if (wasOpen) go(); else setTimeout(go, reduced ? 0 : 420);
    if (focusPanel) { const t = $('#ptitle'); if (t) t.focus({ preventScroll: true }); }
    requestDraw();
  }
  function closePanel() {
    if (selId && byId[selId]) { byId[selId].card.classList.remove('is-sel'); }
    selId = null; panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); requestDraw();
  }
  function step(dir) {
    const list = EV.filter(vis); if (!list.length) return;
    let i = list.indexOf(byId[selId]); i = i < 0 ? 0 : clamp(i + dir, 0, list.length - 1);
    select(list[i].id, true);
  }
  $('#pclose').addEventListener('click', closePanel);
  $('#pprev').addEventListener('click', () => step(-1));
  $('#pnext').addEventListener('click', () => step(1));
  pscroll.addEventListener('click', (ev) => {
    const g = ev.target.closest('[data-go]'); if (g) { select(g.dataset.go, true); return; }
    const p = ev.target.closest('[data-person]'); if (p) { searchEl.value = p.dataset.person; setQuery(p.dataset.person); }
  });

  /* ── Toolbar ── */
  const searchEl = $('#search');
  function setQuery(q) { query = q.trim().toLowerCase(); layout(true); if (selId && byId[selId]) renderPanel(byId[selId]); requestDraw(); }
  searchEl.addEventListener('input', () => setQuery(searchEl.value));
  const catBox = $('#cats');
  CATS.forEach((c) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip cat-' + c.id; b.id = 'cat-' + c.id; b.setAttribute('aria-pressed', 'true');
    const n = EV.filter((e) => e.cat === c.id).length;
    b.innerHTML = '<span class="glyph" aria-hidden="true">' + c.glyph + '</span>' + esc(c.name) + '<span class="n">' + n + '</span>';
    b.title = 'Show or hide ' + c.name;
    b.addEventListener('click', () => { catOn[c.id] = !catOn[c.id]; b.setAttribute('aria-pressed', String(catOn[c.id])); layout(true); if (selId && byId[selId]) renderPanel(byId[selId]); requestDraw(); });
    catBox.appendChild(b);
  });
  const jumps = [['Backstory', 'pre'], ['Vol. 1', 1], ['Vol. 2', 2], ['Vol. 3', 3], ['Vol. 4', 4], ['Vol. 5', 5], ['The crash, 2008', 'crash']];
  const jumpBox = $('#jumps');
  jumps.forEach((j) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip jump'; b.textContent = j[0]; b.id = 'jump-' + j[1];
    b.addEventListener('click', () => {
      hint();
      if (j[1] === 'pre') { flyTo({ dd: 0, px: -PREW / 2 }, v.ppd, Math.min(W / 2, PREW / 2 + 30)); return; }
      if (j[1] === 'crash') { flyTo({ dd: CRASH - DOM0, px: 0 }, Math.max(v.ppd, 1.2), W * 0.42); return; }
      const evs = EV.filter((e) => !e.pre && e.vol === j[1] && e.id !== 'crash2008');
      const a = Math.min.apply(null, evs.map((e) => e.day)), b2 = Math.max.apply(null, evs.map((e) => e.end || e.day));
      const ppd = clamp((W - 330) / Math.max(30, b2 - a), ppdMin, 6);
      flyTo({ dd: (a + b2) / 2 - DOM0, px: 0 }, ppd, (W - 250) / 2 + 20);
    });
    jumpBox.appendChild(b);
  });
  const scaleBtns = Array.from(document.querySelectorAll('#scale button'));
  scaleBtns.forEach((b) => b.addEventListener('click', () => { hint(); const f = byId[selId]; const cx = f && !f.isOff && f.sx > 0 && f.sx < W ? f.sx : W / 2; flyTo(anchorAt(cx), PRESET[b.dataset.level], cx, 800); }));
  let lastLevel = '';
  function syncScale() { const l = levelOf(v.ppd); if (l === lastLevel) return; lastLevel = l; scaleBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.level === l))); }
  $('#zin').addEventListener('click', () => { hint(); zoomTo((wheelT ? wheelT.ppd : v.ppd) * 1.7, W / 2); });
  $('#zout').addEventListener('click', () => { hint(); zoomTo((wheelT ? wheelT.ppd : v.ppd) / 1.7, W / 2); });
  let hinted = false; function hint() { if (!hinted) { hinted = true; hintEl.classList.add('gone'); } }

  document.addEventListener('keydown', (ev) => {
    const tag = (ev.target.tagName || '').toLowerCase(); if (tag === 'input') { if (ev.key === 'Escape') { searchEl.value = ''; setQuery(''); searchEl.blur(); } return; }
    if (ev.key === 'Escape') { if (selId) closePanel(); }
    else if (ev.key === 'ArrowRight' && selId) { ev.preventDefault(); step(1); }
    else if (ev.key === 'ArrowLeft' && selId) { ev.preventDefault(); step(-1); }
    else if (ev.key === 'ArrowRight') { stopAnim(); v.x0 -= 120; requestDraw(); }
    else if (ev.key === 'ArrowLeft') { stopAnim(); v.x0 += 120; requestDraw(); }
    else if (ev.key === '+' || ev.key === '=') zoomTo((wheelT ? wheelT.ppd : v.ppd) * 1.5, W / 2);
    else if (ev.key === '-' || ev.key === '_') zoomTo((wheelT ? wheelT.ppd : v.ppd) / 1.5, W / 2);
  });

  /* ── Sizing ── */
  function resize() {
    const r = stage.getBoundingClientRect();
    W = Math.max(200, r.width); H = Math.max(200, r.height); dpr = Math.min(2.5, window.devicePixelRatio || 1);
    axis.width = Math.round(W * dpr); axis.height = Math.round(H * dpr);
    const mr = mini.getBoundingClientRect(); MW = Math.max(100, mr.width); MH = Math.max(30, mr.height);
    mcan.width = Math.round(MW * dpr); mcan.height = Math.round(MH * dpr);
    const compact = W < 560; stage.classList.toggle('compact', compact);
    T = compact ? { s: { w: 156, h: 28 }, m: { w: 200, h: 64 }, l: { w: 232, h: 230 } } : { s: { w: 172, h: 28 }, m: { w: 228, h: 64 }, l: { w: 258, h: 230 } };
    ppdMin = Math.max(0.62, (W - 90) / (DOM1 - DOM0)); if (v.ppd < ppdMin) v.ppd = ppdMin;
    lastLayoutKey = ''; requestDraw();
  }
  let started = false;
  function start() {
    readColors(); resize();
    const first = toDay('1997-03-01');
    v.ppd = clamp(W < 560 ? 1.6 : 2.3, ppdMin, PPD_MAX); v.x0 = 40 - (first - DOM0) * v.ppd; started = true;
    const hashId = (location.hash || '').slice(1);
    draw();
    if (hashId && byId[hashId]) select(hashId, true);
    if (window.ResizeObserver) new ResizeObserver(() => { resize(); }).observe(stage); else window.addEventListener('resize', resize);
    const mq = window.matchMedia('(prefers-color-scheme: dark)'); const re = () => { readColors(); requestDraw(); };
    if (mq.addEventListener) mq.addEventListener('change', re);
    new MutationObserver(re).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(re);
  }
  window.MV_APP = { select: select, view: v, events: EV, zoomTo: zoomTo, flyTo: flyTo };
  start();
})();

</script>
</body>
